name: ci
on:
  push:
    branches: [main, hardening]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.13', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and integration tests
        run: npm test
      - name: Fixtures end to end, three identical runs
        run: node tests/e2e-fixtures.mjs 3
  package:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pack and check the file list
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --ignore-scripts
          node tests/pack-files.mjs "$RUNNER_TEMP/http-attack-1.0.0.tgz"
      - name: Install the tarball into an empty project and run it
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP/http-attack-1.0.0.tgz"
          npx --no-install http-attack --help
          node "$GITHUB_WORKSPACE/tests/fixtures/fixed-server.mjs" 3918 "$RUNNER_TEMP/consumer/app.db" &
          APP=$!
          sleep 3
          code=0
          MSYS_NO_PATHCONV=1 npx --no-install http-attack http://127.0.0.1:3918             --header "Authorization: Bearer alice" --other-header "Authorization: Bearer bob"             --write 'POST /items {"name":"Ana","email":"ana@example.com"}' --format json > report.json || code=$?
          kill $APP || true
          test "$code" -eq 0 || { echo "smoke run exited $code"; head -c 2000 report.json; exit 1; }
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate .
